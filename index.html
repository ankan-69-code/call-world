<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Call World</title>
    <!-- Mutes the harmless 404 favicon error -->
    <link rel="icon" href="data:,"> 
    <link rel="stylesheet" href="style.css">
    <!-- Google Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <!-- 1. Auth View -->
    <div id="auth-view" class="view-container">
        <div class="card">
            <h1 class="brand">Call World</h1>
            <p class="subtitle">Secure, peer-to-peer video calls.</p>
            
            <!-- GOOGLE SIGN-IN INTERFACE -->
            <div id="google-auth-step" style="margin-top: 30px; display: flex; justify-content: center;">
                <button id="google-signin-btn" class="primary-btn" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="18px" height="18px" viewBox="0 0 48 48" style="display: block;">
                        <g>
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                            <path fill="#4285F4" d="M46.5 24c0-1.55-.15-3.24-.47-4.77H24v9.03h12.75c-.55 2.96-2.23 5.47-4.75 7.16l7.37 5.71C43.68 36.82 46.5 31.02 46.5 24z"></path>
                            <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"></path>
                            <path fill="#34A353" d="M24 46.5c5.93 0 11.17-1.96 14.92-5.36l-7.37-5.71c-2.11 1.42-4.8 2.3-7.55 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 46.5 24 46.5z"></path>
                        </g>
                    </svg>
                    Continue with Google
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Dashboard View -->
    <div id="dashboard-view" class="view-container hidden">
        <div class="top-bar">
            <h2 class="brand">Call World</h2>
            <button id="logout-btn" class="secondary-btn" style="width: auto; margin-top: 0; padding: 8px 16px;">Logout</button>
        </div>
        <div class="action-card">
            <h3>Start a Meeting</h3>
            <button id="generate-link-btn" class="primary-btn" style="margin-top: 20px;">Create New Link</button>
            
            <div id="link-container" class="link-box hidden">
                <input type="text" id="meeting-link" readonly>
                <button id="copy-btn"><span class="material-symbols-outlined">content_copy</span></button>
            </div>
            
            <button id="join-now-btn" class="primary-btn hidden" style="margin-top: 15px;">Join Meeting Now</button>
        </div>
    </div>

    <!-- 3. Meeting View -->
    <div id="meeting-view" class="view-container hidden">
        <div class="video-container">
            <div id="video-grid" class="video-grid"></div>
            
            <!-- Floating Glass Controls -->
            <div class="meeting-controls">
                <button id="toggle-mic-btn" class="icon-btn"><span class="material-symbols-outlined" id="mic-icon">mic</span></button>
                <button id="toggle-cam-btn" class="icon-btn"><span class="material-symbols-outlined" id="cam-icon">videocam</span></button>
                <button id="pip-btn" class="icon-btn"><span class="material-symbols-outlined">picture_in_picture_alt</span></button>
                <button id="hangup-btn" class="icon-btn danger"><span class="material-symbols-outlined">call_end</span></button>
            </div>
        </div>
    </div>

    <!-- WebRTC Legacy Adapter for older mobile phones -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/webrtc-adapter/8.2.3/adapter.min.js"></script>
    <!-- Script module tagged with fresh version to bypass cellular cache updates -->
    <script type="module" src="script.js?v=google-auth"></script>
</body>
</html>
